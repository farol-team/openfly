default: &default
  adapter: postgresql
  url: <%= ENV.fetch("DATABASE_URL") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 8) %>
  checkout_timeout: 5
  variables:
    statement_timeout: 10000
    lock_timeout: 5000
development:
  <<: *default
production:
  <<: *default
test:
  <<: *default
  url: <%= ENV.fetch("POOL_TEST_DATABASE_URL") { URI.parse(ENV.fetch("DATABASE_URL")).tap { |url| url.path = "/execution_pool_test" }.to_s } %>
