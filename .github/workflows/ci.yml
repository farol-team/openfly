name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: execution_pool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/execution_pool_test
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate ephemeral test keys
        run: |
          ruby -rsecurerandom -e 'puts "SECRET_KEY_BASE=#{SecureRandom.hex(64)}"; puts "POOL_TOKEN_PEPPER=#{SecureRandom.hex(64)}"' >> "$GITHUB_ENV"
      - run: bin/rails db:prepare
      - run: docker build -t openfly-runtime:test -f test/fixtures/Dockerfile .
      - run: POOL_DOCKER_INTEGRATION=1 bin/rails test
      - run: python3 -m unittest discover -s test/runtime -p '*_test.py'
      - run: node --test test/client_test.mjs
      - run: pip install jsonschema==4.25.1 openapi-spec-validator==0.7.2
      - run: python3 tools/validate_contract.py && openapi-spec-validator api/openapi.json
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f
        with:
          ruby-version: '3.4'
      - run: gem install brakeman -v 8.1.0 --no-document && gem install bundler-audit -v 0.9.3 --no-document
      - run: brakeman --no-pager
      - run: bundle-audit check --update
      - run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact
